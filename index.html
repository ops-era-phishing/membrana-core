<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="MEMBRANA // Quantum Descent">
  <title>MEMBRANA // Quantum Descent</title>

  <style>
    /* =========================================================
       MEMBRANA // QUANTUM DESCENT
       Single-file experience
       ========================================================= */

    :root {
      --bg: #000;
      --panel: #0d0d0d;
      --ink: #eaeaea;
      --muted: #666;

      --cyan: #00f7ff;
      --magenta: #ff00f7;
      --accent: #ff2e63;

      --glitch-cyan: #0ff;
      --glitch-magenta: #f0f;

      --success: #22ffaa;

      --radius: 8px;
      --transition: 0.3s ease;
    }

    /* =========================
       RESET
       ========================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    /* =========================
       UTILITIES
       ========================= */

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .blink {
      animation: blink 1.5s steps(2, end) infinite;
    }

    /* =========================
       GLOBAL EFFECTS
       ========================= */

    .quantum-noise,
    .quantum-distortion {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .quantum-noise {
      z-index: 1000;
      opacity: 0.02;
      mix-blend-mode: overlay;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABOSURBVGhD7cExAQAwDMCg+zfdm1gQ+JMBMiRIkCBBggQJEiRIkCBBggQJEiRIkCBBggQJEiRIkCBBggQJEiRIkCBBggQJEiRIkPA1fAAe5AlBz/ZVQAAAAABJRU5ErkJggg==");
    }

    .quantum-distortion {
      z-index: 999;
      background:
        radial-gradient(
          circle at center,
          transparent 0%,
          rgba(0, 247, 255, 0.02) 100%
        );
      mix-blend-mode: screen;
      animation: pulse 10s infinite alternate;
    }

    /* =========================
       STAGE
       ========================= */

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 40px);
    }

    /* =========================
       INITIALIZATION
       ========================= */

    #loading {
      flex-direction: column;
      gap: 18px;

      background:
        radial-gradient(
          circle at center,
          #0a0a0a 0%,
          #000 100%
        );
    }

    .scan {
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          transparent,
          rgba(255, 255, 255, 0.02),
          transparent
        );

      mix-blend-mode: screen;
      animation: scan 6s linear infinite;
    }

    .card {
      position: relative;
      width: min(900px, 100%);
      padding: clamp(14px, 2vw, 24px);

      background: rgba(5, 5, 5, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);

      overflow: hidden;

      backdrop-filter: blur(4px);

      box-shadow:
        0 0 30px rgba(0, 240, 255, 0.1);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          rgba(0, 247, 255, 0.03),
          rgba(255, 0, 247, 0.03)
        );
    }

    .title {
      margin-bottom: 12px;

      color: transparent;

      font-size: clamp(24px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;

      background:
        linear-gradient(
          90deg,
          var(--glitch-cyan),
          var(--glitch-magenta)
        );

      -webkit-background-clip: text;
      background-clip: text;

      text-shadow:
        2px 0 var(--glitch-cyan),
        -2px 0 var(--glitch-magenta),
        0 0 8px rgba(255, 255, 255, 0.3);

      animation: glitch 5s infinite alternate;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      margin-bottom: 12px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 11px;
      height: 11px;

      background: #333;
      border-radius: 50%;

      transition: all var(--transition);
    }

    .dot.on {
      background: var(--success);

      box-shadow:
        0 0 10px var(--success);

      animation: pulse 1.5s infinite;
    }

    .progress {
      position: relative;

      width: 100%;
      height: 12px;

      overflow: hidden;

      background: rgba(15, 15, 15, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .bar {
      position: relative;

      width: 0;
      height: 100%;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--magenta)
        );

      transition: width 0.5s ease-out;
    }

    .bar::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );

      animation: shine 2s infinite;
    }

    .log {
      max-height: 36vh;
      padding: 8px;

      overflow-y: auto;

      background: rgba(10, 10, 10, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;

      color: #cfcfcf;
      font-size: clamp(12px, 1.9vw, 14px);
      line-height: 1.4;
    }

    .log-entry {
      min-height: 1.4em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;

      margin-top: 16px;
    }

    button {
      padding: 10px 16px;

      color: var(--ink);
      background: rgba(19, 19, 19, 0.7);

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);

      cursor: pointer;

      backdrop-filter: blur(4px);

      transition: all var(--transition);
    }

    button:hover {
      transform: translateY(-2px);

      border-color: var(--cyan);

      box-shadow:
        0 5px 15px rgba(0, 247, 255, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    /* =========================
       GLITCH TEXT
       ========================= */

    .glitch-line {
      position: relative;
    }

    .glitch-line::before,
    .glitch-line::after {
      content: attr(data-text);

      position: absolute;
      inset: 0;

      width: 100%;

      background: var(--bg);
    }

    .glitch-line::before {
      left: -2px;

      color: transparent;

      text-shadow:
        2px 0 var(--glitch-cyan);

      clip-path: inset(0 0 60% 0);

      animation:
        glitch-clip 3s infinite linear alternate-reverse;
    }

    .glitch-line::after {
      left: 2px;

      color: transparent;

      text-shadow:
        -2px 0 var(--glitch-magenta);

      clip-path: inset(60% 0 0 0);

      animation:
        glitch-clip 2s infinite linear alternate-reverse;
    }

    /* =========================
       FEED
       ========================= */

    #feedStage {
      align-items: flex-start;

      overflow-y: auto;

      background:
        radial-gradient(
          circle at center,
          #050505 0%,
          #000 100%
        );
    }

    .layout {
      width: min(900px, 100%);
      margin: auto;

      overflow: hidden;

      background: rgba(13, 13, 13, 0.8);
      border-radius: var(--radius);

      box-shadow:
        0 0 40px rgba(0, 240, 255, 0.1);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 16px;

      background: rgba(0, 0, 0, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);

      backdrop-filter: blur(8px);
    }

    .brand {
      color: var(--magenta);

      font-size: 1.1em;
      font-weight: 900;
      letter-spacing: 3px;

      text-shadow:
        1px 0 var(--cyan),
        -1px 0 var(--magenta);

      animation: glitch 7s infinite alternate;
    }

    #feed {
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .post {
      margin: 12px 0;
      padding: 16px;

      background: rgba(20, 20, 20, 0.6);

      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);

      backdrop-filter: blur(4px);

      animation: pop 0.8s ease;

      transition: all var(--transition);
    }

    .post:hover {
      transform: translateY(-2px);

      border-color: rgba(255, 255, 255, 0.2);

      box-shadow:
        0 5px 15px rgba(0, 247, 255, 0.1);
    }

    .user {
      margin-bottom: 2px;

      color: var(--cyan);

      font-weight: 700;
      letter-spacing: 1px;
    }

    .time {
      color: #777;
      font-size: 0.8em;
    }

    .content {
      margin-top: 8px;
      line-height: 1.6;
    }

    .glitch {
      display: inline-block;

      color: var(--magenta);

      text-shadow:
        1px 0 var(--cyan),
        -1px 0 var(--magenta);
    }

    .glitch:hover {
      animation: glitch 0.5s infinite;
    }

    footer {
      padding: 20px;

      color: #666;
      text-align: center;

      font-size: 0.85em;

      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* =========================
       TOAST
       ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;

      padding: 12px 20px;

      color: #cfcfcf;

      background: rgba(13, 13, 13, 0.9);

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.5);

      backdrop-filter: blur(6px);

      transform: translateX(-50%);

      animation: fade-in 0.5s ease;
    }

    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes scan {
      from {
        transform: translateY(-100%);
      }

      to {
        transform: translateY(100%);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0.1;
      }
    }

    @keyframes glitch {
      0% {
        text-shadow:
          2px 0 var(--glitch-cyan),
          -2px 0 var(--glitch-magenta);
      }

      20% {
        text-shadow:
          -2px 0 var(--glitch-cyan),
          2px 0 var(--glitch-magenta);
      }

      40% {
        text-shadow:
          3px 0 var(--glitch-cyan),
          -3px 0 var(--glitch-magenta);
      }

      60% {
        text-shadow:
          -3px 0 var(--glitch-cyan),
          0 0 var(--glitch-magenta);
      }

      80% {
        text-shadow:
          0 0 var(--glitch-cyan),
          -4px 0 var(--glitch-magenta);
      }

      100% {
        text-shadow:
          4px 0 var(--glitch-cyan),
          0 0 var(--glitch-magenta);
      }
    }

    @keyframes glitch-clip {
      0% {
        clip-path: inset(10% 0 80% 0);
      }

      20% {
        clip-path: inset(55% 0 30% 0);
      }

      40% {
        clip-path: inset(20% 0 65% 0);
      }

      60% {
        clip-path: inset(70% 0 15% 0);
      }

      80% {
        clip-path: inset(35% 0 45% 0);
      }

      100% {
        clip-path: inset(60% 0 25% 0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes shine {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100%);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
      .stage {
        padding: 12px;
      }

      .card {
        padding: 14px;
      }

      .brand {
        font-size: 0.85em;
        letter-spacing: 1px;
      }

      header {
        padding: 12px;
      }

      #feed {
        padding: 10px;
      }

      .post {
        padding: 13px;
      }
    }

    /* =========================
       REDUCED MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

       ========================================================= -->

  <section

  >

    /* =========================================================

    const DOM = {

      bar: document.getElementById("bar"),
      log: document.getElementById("log"),
      status: document.getElementById("st"),

      dots: [
        document.getElementById("d1"),

      ],

      feed: document.getElementById("feed"),

      timers: {
        initialization: null,

    /* =========================================================
       QUANTUM LOGS
       ========================================================= */

    const QUANTUM_LOGS = [

    /* =========================================================

    const QUANTUM_NARRATIVE = [
      {

      },

      {

      {

    /* =========================================================
       HELPERS
       ========================================================= */

    const random = (min, max) =>
      Math.random() * (max - min) + min;

    const randomItem = array =>
      array[Math.floor(Math.random() * array.length)];


    /* =========================================================
       TOAST
       ========================================================= */

    let toastTimer = null;

    function showToast(message) {
      DOM.toast.textContent = message;
      DOM.toast.classList.remove("hidden");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        DOM.toast.classList.add("hidden");
      }, 3000);

      if (Math.random() < 0.4) {
        DOM.toast.style.animation = "glitch 0.3s";

        setTimeout(() => {
          DOM.toast.style.animation = "";
        }, 300);
      }
    }


    /* =========================================================
       AUDIO
       ========================================================= */

    const AudioSystem = {
      context: null,
      source: null,
      filter: null,

      async start() {
        if (!this.context) {
          this.context =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

          this.source =
            this.context.createMediaElementSource(
              DOM.music
            );

          this.filter =
            this.context.createBiquadFilter();

          this.filter.type = "lowpass";
          this.filter.frequency.value = 1000;

          this.source
            .connect(this.filter)
            .connect(this.context.destination);
        }

        if (this.context.state === "suspended") {
          await this.context.resume();
        }

        DOM.music.volume = CONFIG.audio.volume;

        await DOM.music.play();

        STATE.audioStarted = true;
      }
    };


    DOM.playAudio.addEventListener(
      "click",
      async () => {
        try {
          await AudioSystem.start();

          DOM.playAudio.textContent =
            "Neural Sync: Active ✓";
        } catch {
          showToast(
            "audio sync failed. proceed with caution."
          );
        }
      }
    );


    /* =========================================================
       INITIALIZATION LOG
       ========================================================= */

    function addQuantumLog(message) {
      const entry =
        document.createElement("div");

      entry.className = "log-entry";
      entry.textContent = message;

      if (Math.random() < 0.3) {
        entry.classList.add("glitch-line");
        entry.dataset.text = message;

        setTimeout(() => {
          entry.classList.remove("glitch-line");
        }, 500);
      }

      DOM.log.appendChild(entry);
      DOM.log.scrollTop = DOM.log.scrollHeight;
    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    function updateInitialization() {
      if (!STATE.initializing) {
        return;
      }

      STATE.progress = Math.min(
        100,
        STATE.progress +
          random(
            CONFIG.initialization.minStep,
            CONFIG.initialization.maxStep
          )
      );

      DOM.bar.style.width =
        `${STATE.progress}%`;


      if (STATE.progress > 15) {
        DOM.dots[0].classList.add("on");
      }

      if (STATE.progress > 50) {
        DOM.dots[1].classList.add("on");
      }


      if (
        STATE.logIndex <
        QUANTUM_LOGS.length
      ) {
        addQuantumLog(
          QUANTUM_LOGS[
            STATE.logIndex++
          ]
        );
      }


      if (STATE.progress < 100) {
        DOM.status.textContent =
          randomItem([
            "initializing",
            "synchronizing",
            "breaching",
            "observing"
          ]);

        STATE.timers.initialization =
          setTimeout(
            updateInitialization,
            random(
              CONFIG.initialization.minDelay,
              CONFIG.initialization.maxDelay
            )
          );

        return;
      }


      DOM.dots[2].classList.add("on");

      DOM.status.textContent =
        "quantum link established";

      addQuantumLog(
        "> membrane breach successful. welcome observer."
      );

      STATE.timers.initialization =
        setTimeout(
          enterMembrane,
          CONFIG.initialization.finalDelay
        );
    }


    function startInitialization() {
      STATE.timers.initialization =
        setTimeout(
          updateInitialization,
          CONFIG.initialization.startDelay
        );
    }


    /* =========================================================
       BYPASS
       ========================================================= */

    DOM.skipInstall.addEventListener(
      "click",
      () => {
        if (!STATE.initializing) {
          return;
        }

        STATE.initializing = false;

        clearTimeout(
          STATE.timers.initialization
        );

        DOM.bar.style.width = "100%";

        DOM.dots.forEach(dot =>
          dot.classList.add("on")
        );

        addQuantumLog(
          "> debug protocol activated. quantum link unstable."
        );

        setTimeout(
          enterMembrane,
          600
        );
      }
    );


    /* =========================================================
       ENTER MEMBRANE
       ========================================================= */

    function enterMembrane() {
      if (STATE.enteredMembrane) {
        return;
      }

      STATE.enteredMembrane = true;

      DOM.loading.classList.add("hidden");
      DOM.feedStage.classList.remove("hidden");

      showToast(
        "quantum synchronization complete."
      );

      startFeed();
      startBackgroundEffects();
    }


    /* =========================================================
       ANOMALOUS TIME
       ========================================================= */

    function createAnomalousTime() {
      const date = new Date();

      const anomaly = Math.random();

      if (anomaly < 0.3) {
        date.setFullYear(2045);
      } else if (anomaly < 0.5) {
        date.setHours(
          (date.getHours() + 13) % 24
        );
      }

      const modes = [
        "quantum",
        "entangled",
        "superposed",
        "observed"
      ];

      return (
        `${date.toLocaleTimeString()} • ` +
        randomItem(modes)
      );
    }


    /* =========================================================
       GLITCH TEXT
       ========================================================= */

    function renderGlitchedText(
      container,
      text
    ) {
      const words = text.split(/(\s+)/);

      words.forEach(word => {
        if (/^\s+$/.test(word)) {
          container.appendChild(
            document.createTextNode(word)
          );

          return;
        }

        const chance = Math.random();

        if (chance < 0.15) {
          const span =
            document.createElement("span");

          span.className = "glitch";
          span.textContent = word;

          container.appendChild(span);

          return;
        }

        if (chance < 0.20) {
          container.appendChild(
            document.createTextNode(
              [...word].reverse().join("")
            )
          );

          return;
        }

        if (chance < 0.25) {
          container.appendChild(
            document.createTextNode(
              word.toUpperCase()
            )
          );

          return;
        }

        container.appendChild(
          document.createTextNode(word)
        );
      });
    }


    /* =========================================================
       POST CREATION
       ========================================================= */

    function createPost(post) {
      const article =
        document.createElement("article");

      article.className = "post";

      const user =
        document.createElement("div");

      user.className = "user";
      user.textContent = `@${post.user}`;


      const time =
        document.createElement("div");

      time.className = "time";
      time.textContent =
        createAnomalousTime();


      const content =
        document.createElement("div");

      content.className = "content";

      renderGlitchedText(
        content,
        post.text
      );


      article.append(
        user,
        time,
        content
      );


      if (Math.random() < 0.2) {
        article.style.borderLeft =
          `3px solid ${
            Math.random() < 0.5
              ? "var(--cyan)"
              : "var(--magenta)"
          }`;
      }


      return article;
    }


    /* =========================================================
       FEED
       ========================================================= */

    function dropPost() {
      if (!STATE.enteredMembrane) {
        return;
      }

      if (
        STATE.postIndex >=
        QUANTUM_NARRATIVE.length
      ) {
        finishFeed();
        return;
      }


      const post =
        QUANTUM_NARRATIVE[
          STATE.postIndex++
        ];


      DOM.feed.appendChild(
        createPost(post)
      );


      DOM.counter.textContent =
        `${STATE.postIndex}/${QUANTUM_NARRATIVE.length}`;


      const nextDelay =
        CONFIG.feed.interval +
        random(
          0,
          CONFIG.feed.variation
        );


      STATE.timers.feed =
        setTimeout(
          dropPost,
          nextDelay
        );
    }


    function startFeed() {
      dropPost();
    }


    /* =========================================================
       FEED FINISH
       ========================================================= */

    function finishFeed() {
      if (STATE.redirecting) {
        return;
      }

      STATE.redirecting = true;

      showToast(
        "quantum collapse initiated."
      );


      STATE.timers.redirect =
        setTimeout(() => {
          document.body.style.animation =
            "glitch 0.5s infinite";


          setTimeout(() => {
            window.location.href =
              CONFIG.navigation.nextUrl;
          }, 800);

        }, CONFIG.navigation.redirectDelay);
    }


    /* =========================================================
       BACKGROUND EFFECTS
       ========================================================= */

    function startBackgroundEffects() {

      /* Periodic color anomaly */

      setInterval(() => {
        if (!STATE.enteredMembrane) {
          return;
        }

        document.body.style.backgroundColor =
          `hsl(${random(0, 10)}, 100%, 2%)`;

        setTimeout(() => {
          document.body.style.backgroundColor =
            "#000";
        }, 100);

      }, CONFIG.effects.backgroundInterval);


      /* Screen distortion */

      setInterval(() => {
        if (!STATE.enteredMembrane) {
          return;
        }

        if (Math.random() < 0.3) {
          document.body.style.transform =
            "translateX(2px)";

          setTimeout(() => {
            document.body.style.transform =
              "translateX(-2px)";

            setTimeout(() => {
              document.body.style.transform = "";
            }, 50);

          }, 50);
        }

      }, CONFIG.effects.screenGlitchInterval);


      /* Quantum visual anomaly */

      setInterval(() => {
        if (!STATE.enteredMembrane) {
          return;
        }

        if (Math.random() >= 0.2) {
          return;
        }

        const glitch =
          document.createElement("div");

        Object.assign(
          glitch.style,
          {
            position: "fixed",
            inset: "0",
            background:
              `rgba(${random(0, 100)}, ${random(0, 100)}, ${random(0, 100)}, 0.02)`,
            pointerEvents: "none",
            zIndex: "9999",
            mixBlendMode: "screen"
          }
        );

        document.body.appendChild(glitch);

        setTimeout(() => {
          glitch.remove();
        }, 100);

      }, CONFIG.effects.distortionInterval);
    }


    /* =========================================================
       EASTER EGG
       TYPE: REPOST
       ========================================================= */

    let keyBuffer = "";

    window.addEventListener(
      "keydown",
      event => {
        if (event.key.length !== 1) {
          return;
        }

        keyBuffer =
          (
            keyBuffer +
            event.key
          ).slice(-6);


        if (
          keyBuffer.toLowerCase() ===
          "repost"
        ) {
          showToast(
            "quantum channel opened: #repost.ai"
          );

          document
            .querySelectorAll(".post")
            .forEach(post => {
              post.style.borderColor =
                "var(--cyan)";

              setTimeout(() => {
                post.style.borderColor = "";
              }, 1000);
            });
        }
      }
    );


    /* =========================================================
       START
       ========================================================= */

    startInitialization();

  </script>
</body>
</html>
